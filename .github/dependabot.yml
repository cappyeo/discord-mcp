version: 2
updates:
  # Workflow `uses:` are pinned to commit SHAs. Without this ecosystem those
  # pins silently rot - dependabot rewrites the SHA and the `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep routine automation reviewable. Major migrations and the two known
    # toolchain-floor changes below need dedicated branches and full evidence.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: '@biomejs/biome'
        versions: ['>=2.5.0']
      - dependency-name: tsdown
        versions: ['>=0.22.0']
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
