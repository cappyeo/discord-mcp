name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Org self-hosted runner 'sv-main' (labels self-hosted, Linux, X64, sv, deploy,
    # sv-2), which runs on the deployment host itself (192.168.1.91), so the token
    # goes from the org secret into the compose override without a network hop.
    runs-on: [self-hosted, Linux, X64, sv-2]
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /root/Projects/discord-mcp
      # No host port is published: the netbird overlay's proxy service is the
      # only ingress. The --resolve lands probes on the mesh IP, inside the
      # router's ipAllowList.
      SMOKE_BASE: https://discord-mcp.the1studio.org
      REPO_URL: git@github.com:The1Studio/discord-mcp.git
    steps:
      - name: Clone or update the deploy checkout to origin/main
        # The runner is dietpi, which cannot traverse /root, so every git action runs
        # through sudo. reset --hard, not pull: this fork rebases onto upstream and
        # force-pushes main, so a merge-on-pull would conflict or drag stale commits
        # back in. A missing checkout is bootstrapped here, so the first run on this
        # box needs no manual setup.
        run: |
          set -euo pipefail
          sudo mkdir -p "$(dirname "$DEPLOY_ROOT")"
          # The existence test needs sudo too: dietpi cannot stat inside /root, so a
          # plain `-d` on an already-cloned checkout reads as false and the clone
          # below then fails with "destination path already exists".
          if ! sudo test -d "$DEPLOY_ROOT/.git"; then
            sudo git clone "$REPO_URL" "$DEPLOY_ROOT"
          fi
          sudo git -C "$DEPLOY_ROOT" fetch --prune origin
          sudo git -C "$DEPLOY_ROOT" reset --hard origin/main
          sudo git -C "$DEPLOY_ROOT" log -1 --oneline

      - name: Write docker-compose.override.yml from the org secret
        # The override is gitignored and regenerated on every deploy: the org secret
        # DISCORD_TOKEN is the single source of truth, so no plaintext token is
        # hand-maintained on the box.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_TOKEN:-}" ]; then
            echo "::error::org secret DISCORD_TOKEN is unset or not visible to this repository"
            exit 1
          fi
          if [ -z "${DISCORD_CLIENT_SECRET:-}" ]; then
            echo "::error::org secret DISCORD_CLIENT_SECRET is unset or not visible to this repository"
            exit 1
          fi
          umask 077
          sudo tee "$DEPLOY_ROOT/docker-compose.override.yml" > /dev/null <<EOF
          services:
            discord-mcp:
              environment:
                DISCORD_TOKEN: "$DISCORD_TOKEN"
                # Callers authenticate with their own Discord user OAuth2 token; the
                # shared DISCORD_MCP_ACCESS_TOKEN secret is not used in this mode. Each
                # call is authorized by that user's guild/channel/role permissions.
                MCP_AUTH_MODE: "oauth2"
                MCP_PUBLIC_URL: "https://discord-mcp.the1studio.org"
                # The broker's own application identity. Discord's token endpoint
                # needs the secret, which never reaches a client.
                DISCORD_CLIENT_ID: "1566823844801548490"
                DISCORD_CLIENT_SECRET: "$DISCORD_CLIENT_SECRET"
                # Destructive tools and Components V2 sends execute only when a call ALSO
                # passes __confirm:true (V2: plus the one-time payload hash + approval id).
                # With the default (true) every such call returns DRY_RUN_PREVIEW, so V2
                # cards could never be sent from this deployment.
                MCP_DRY_RUN: "false"
          EOF
          # tee keeps an existing file's mode, so an override left at 644 by an
          # earlier hand-written version would stay world-readable.
          sudo chmod 600 "$DEPLOY_ROOT/docker-compose.override.yml"

      - name: Rebuild and restart the stack
        # -f rather than `cd`: the runner is dietpi, which cannot enter /root, while
        # compose runs as root through sudo. Naming a file with -f also disables
        # compose's automatic docker-compose.override.yml discovery, so the override
        # must be passed explicitly - omitting it silently drops the token and leaves
        # the container crash-looping. Same for the netbird overlay: it is the only
        # place the proxy service for this service is declared, so omitting it
        # silently withdraws discord-mcp.the1studio.org from the mesh.
        run: |
          set -euo pipefail
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" \
            -f "$DEPLOY_ROOT/docker-compose.netbird.yml" up -d --build
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" \
            -f "$DEPLOY_ROOT/docker-compose.netbird.yml" ps

      - name: Smoke test - readiness endpoint
        # /healthz is intentionally unauthenticated (probes carry no Discord
        # identity); /mcp is not, so readiness must not probe it directly.
        run: |
          set -euo pipefail
          curl_args=(-sS)
          [ -n "${SMOKE_RESOLVE:-}" ] && curl_args+=(--resolve "$SMOKE_RESOLVE")
          for i in $(seq 1 10); do
            code=$(curl "${curl_args[@]}" -o /dev/null -w '%{http_code}' "${SMOKE_BASE}/healthz" || true)
            if [ "$code" = "200" ]; then
              echo " ✓ readiness pass (HTTP $code on /healthz)"
              exit 0
            fi
            echo "attempt $i: not ready, retry in 3s"
            sleep 3
          done
          echo "✗ readiness probe failed"
          sudo docker compose -f "$DEPLOY_ROOT/docker-compose.yml" \
            -f "$DEPLOY_ROOT/docker-compose.override.yml" \
            -f "$DEPLOY_ROOT/docker-compose.netbird.yml" logs --tail 50
          exit 1

      - name: Smoke test - the OAuth2 gate is active
        # Unauthenticated /mcp must be refused. This proves the deployment is
        # running in oauth2 mode rather than the shared-token default, which
        # would otherwise serve the full tool surface to anyone who reaches it.
        run: |
          set -euo pipefail
          curl_args=(-sS)
          [ -n "${SMOKE_RESOLVE:-}" ] && curl_args+=(--resolve "$SMOKE_RESOLVE")
          code=$(curl "${curl_args[@]}" -o /dev/null -w '%{http_code}' -X POST "${SMOKE_BASE}/mcp" \
            -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)
          if [ "$code" != "401" ]; then
            echo "::error::expected 401 for an unauthenticated /mcp request, got $code"
            exit 1
          fi
          echo " ✓ OAuth2 gate refuses unauthenticated callers"

      - name: Smoke test - OAuth discovery is published
        # A client that cannot discover the authorization server can never
        # obtain a credential, so both documents must be reachable and name
        # this deployment as the issuer.
        run: |
          set -euo pipefail
          curl_args=(-sS)
          [ -n "${SMOKE_RESOLVE:-}" ] && curl_args+=(--resolve "$SMOKE_RESOLVE")
          curl "${curl_args[@]}" "${SMOKE_BASE}/.well-known/oauth-protected-resource/mcp" \
            -o /tmp/discord-mcp-prm.json
          curl "${curl_args[@]}" "${SMOKE_BASE}/.well-known/oauth-authorization-server" \
            -o /tmp/discord-mcp-as.json
          grep -q '"resource"' /tmp/discord-mcp-prm.json
          grep -q '"registration_endpoint"' /tmp/discord-mcp-as.json
          echo " ✓ OAuth discovery documents served"

      - name: Smoke test - the bot secret authenticates against Discord
        # Readiness only proves the container is up with *some* long-enough token; a
        # wrong or rotated-away secret would deploy green and then 401 every tool
        # call. Ask Discord directly, since /mcp now needs a user OAuth2 token.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          set -euo pipefail
          token="${DISCORD_TOKEN#Bot }"
          curl -sS -H "Authorization: Bot ${token}" \
            https://discord.com/api/v10/users/@me \
            -o /tmp/discord-mcp-identity.json
          grep -q '"bot":true' /tmp/discord-mcp-identity.json
          echo " ✓ bot identity confirmed"
