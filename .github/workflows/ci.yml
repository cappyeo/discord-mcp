name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The audit job was push/PR-triggered only, so dependency drift went unseen
    # between commits. Weekly cron re-runs it against a quiet tree.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ['22.12', '24.x']
    env:
      # Events uses built-in SQLite, still flag-gated at the upstream minimum.
      NODE_OPTIONS: ${{ matrix.node == '22.12' && '--experimental-sqlite' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Core/CLI keep the Node 22.12 floor. Astro requires a newer Node, so
      # site checks run on both Node 24 jobs and in the dedicated docs gate.
      - run: pnpm exec turbo run typecheck ${{ matrix.node == '22.12' && '--filter=!site' || '' }}
      - run: pnpm exec turbo run build ${{ matrix.node == '22.12' && '--filter=!site' || '' }}
      - name: Verify durable workflow integration
        run: node packages/mcp-core/scripts/verify-workflows.mjs
      - run: pnpm exec turbo run test ${{ matrix.node == '22.12' && '--filter=!site' || '' }}
      - run: pnpm --filter @discord-mcp/core exec vitest run --coverage
        if: matrix.os != 'ubuntu-24.04' || matrix.node != '22.12'
      - run: pnpm --filter @discord-mcp/core exec vitest run --coverage --no-file-parallelism
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '22.12'
      - run: pnpm exec publint --strict packages/mcp-core
      - run: pnpm exec publint --strict packages/mcp-server
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node .github/scripts/assert-no-workspace-protocol.mjs
      - name: Verify clean-install packaged transports
        run: node .github/scripts/assert-packaged-cli.mjs
  catalog-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build --pull --tag discord-mcp-catalog:ci .
      - name: Verify credential-free catalog container
        run: node .github/scripts/assert-catalog-container.mjs
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate --prod
