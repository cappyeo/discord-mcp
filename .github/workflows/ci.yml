name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # The audit job was push/PR-triggered only, so dependency drift went unseen
    # between commits. Weekly cron re-runs it against a quiet tree.
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
# Every job runs on the org's self-hosted ARC pool (Linux/X64). There are no
# Windows or macOS runners in the pool and no matrix: the engine floor is
# `node >=22.12`, and the pool's 22.12 is what CI pins.
jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    # The ARC pool is shared. `pnpm/action-setup` installs to a fixed
    # ~/setup-pnpm and rmdirs it on cleanup, which fails with ENOTEMPTY when a
    # second job starts on the same runner ("Worker pnpm#1 exited with code 1").
    # Install pnpm into a per-job prefix instead: no shared mutable directory.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      - name: Install pnpm into a per-job prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@9.15.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify durable workflow integration
        run: node packages/mcp-core/scripts/verify-workflows.mjs
      - run: pnpm test
      # Single-file parallelism is off so the coverage gate is reproducible.
      - run: pnpm --filter @discord-mcp/core exec vitest run --coverage --no-file-parallelism
      - run: pnpm exec publint --strict packages/mcp-core
      - run: pnpm exec publint --strict packages/mcp-server
  pack:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      - name: Install pnpm into a per-job prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@9.15.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node .github/scripts/assert-no-workspace-protocol.mjs
      - name: Verify clean-install packaged transports
        run: node .github/scripts/assert-packaged-cli.mjs
  catalog-container:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      - name: Install pnpm into a per-job prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@9.15.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: docker build --pull --tag discord-mcp-catalog:ci .
      - name: Verify credential-free catalog container
        run: node .github/scripts/assert-catalog-container.mjs
  audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
      - name: Install pnpm into a per-job prefix
        run: |
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@9.15.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # Reports, but does not gate: the remaining findings are transitive
      # advisories inside @discordjs/rest's bundled undici that this repo cannot
      # bump without patching the SDK. Tracked separately from CI health.
      - run: pnpm audit --audit-level=moderate --prod || true
