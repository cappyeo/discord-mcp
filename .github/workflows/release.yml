name: release

# Both publishable manifests set `publishConfig.provenance: true`, which
# requires an OIDC token - publishing from a laptop hard-fails and the usual
# workaround silently drops the attestation. This workflow supplies `id-token:
# write` and only runs after an explicit `workflow_dispatch` for an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v0.12.0)'
        required: true
        type: string
      registry_only:
        description: 'Skip npm and retry MCP Registry metadata from the selected branch'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    if: ${{ !inputs.registry_only }}
    runs-on: ubuntu-24.04
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Verify release metadata
        run: node .github/scripts/assert-release-metadata.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Resolve release commit
        id: release-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact-SHA CI passed
        run: node .github/scripts/assert-release-ci.mjs
        env:
          RELEASE_SHA: ${{ steps.release-sha.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm build
      - run: pnpm test
      - name: Verify packed package manifests
        run: node .github/scripts/assert-no-workspace-protocol.mjs
      # --provenance is already declared via publishConfig in each manifest.
      - run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    needs: publish
    if: ${{ always() && (inputs.registry_only || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Resolve release commit
        id: registry-release-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify exact-SHA CI passed
        run: node .github/scripts/assert-release-ci.mjs
        env:
          RELEASE_SHA: ${{ steps.registry-release-sha.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install MCP Registry publisher
        run: |
          curl -fsSLo mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz
          echo "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate Registry manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish Registry metadata
        run: ./mcp-publisher publish server.json
